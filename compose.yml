services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: YourPassword123!
    ports:
      - '1433:1433'
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: YourPassword123!
    entrypoint: []
    command:
      - /bin/bash
      - -lc
      - >
        until /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1;
        do
          echo 'Waiting for MSSQL to accept connections...';
          sleep 2;
        done;
        /opt/mssql-tools18/bin/sqlcmd -C -S db -U sa -P "$$MSSQL_SA_PASSWORD" -Q "IF DB_ID('metrofix_db') IS NULL CREATE DATABASE [metrofix_db]";
        echo 'Database metrofix_db is ready.'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: sh -lc "npm install && npm run start:dev --workspace apps/api"
    environment:
      DB_HOST: db
      DB_PORT: '1433'
      DB_USERNAME: sa
      DB_PASSWORD: YourPassword123!
      DB_NAME: metrofix_db
      PORT: '3000'
      NODE_ENV: development
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/node_modules
    ports:
      - '3000:3000'
    depends_on:
      db-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: sh -lc "npm install && npm run dev --workspace apps/web -- --host 0.0.0.0 --port 5173"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  mssql_data:
  api_node_modules:
  web_node_modules:
