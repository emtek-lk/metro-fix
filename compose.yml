services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: metrofix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d metrofix']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: sh -lc "npm install && npm run start:dev --workspace apps/api"
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: metrofix
      PORT: '3000'
      NODE_ENV: development
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/node_modules
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: sh -lc "npm install && npm run dev --workspace apps/web -- --host 0.0.0.0 --port 5173"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
