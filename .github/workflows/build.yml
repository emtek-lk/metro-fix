name: Metro-Fix CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Typecheck Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # The repo requires npm ^9.2.0 (devEngines); Node 22 ships npm 10, which refuses to run.
      - name: Use npm 9
        run: npm install -g npm@9.9.4

      - name: Install Dependencies
        run: npm ci

      - name: Run Monorepo Build
        run: npm run build
